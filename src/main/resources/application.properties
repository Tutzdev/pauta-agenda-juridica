spring.application.name=pauta

# Só aceita conexões deste computador: não há login, então a agenda não fica exposta na rede.
server.address=${PAUTA_ADDRESS:127.0.0.1}
server.port=${PAUTA_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.compression.enabled=true

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pauta;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.locations=classpath:db/migration
spring.jackson.time-zone=America/Sao_Paulo

# Escritório
pauta.office.name=${PAUTA_ESCRITORIO:}
pauta.office.lawyer-name=${PAUTA_ADVOGADA:Dra.}
pauta.office.city=${PAUTA_CIDADE:Volta Redonda}

# Alertas: prazos que vencem nos próximos N dias aparecem como "próximos".
pauta.alerts.upcoming-days=${PAUTA_DIAS_ALERTA:5}

# Calendário forense: feriados além dos nacionais (MM-dd). Padrão: Volta Redonda (17/07) e RJ (23/04).
pauta.deadlines.local-holidays=${PAUTA_FERIADOS_LOCAIS:04-23,07-17}
pauta.deadlines.court-recess=${PAUTA_RECESSO:true}
